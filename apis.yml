- aid: even-financial:even-financial-lead-api
  name: Even Financial Lead API
  description: >-
    A lead combines information about a user with search criteria for financial products, and is submitted
    in exchange for a rate table.


    A rate table is a list of financial offers that match a submitted lead.


    ### Lead Details


    No fields are required on a lead, but depending on the type of product requested, a minimum subset
    is required in order to potentially receive personalized offers. For details, see [the Financial Products
    overview](https://engine.tech/docs/api-reference/#financial-products).


    A lead may request multiple product types, in which case the returned rate table will include a list
    for each product type with matching offers.


    ### Asynchronous Rate Tables


    Often a rate table will be built asynchronously. This means that although the rate table gets returned,
    the API may still be waiting for responses from one or more financial institutions. In these cases,
    you should poll the rate table until all responses are resolved before displaying the offers to the
    end user.


    So, if you submit a lead via the "Submit lead" endpoint and the returned rate table has a non-empty
    `pendingResponses` array, you should reload the rate table via the "Get rate table" endpoint, and
    continue to do so until `pendingResponses` is empty.
