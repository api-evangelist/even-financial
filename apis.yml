aid: even-financial
name: Even Financial
description: >-
  Engine by MoneyLion (formerly Even Financial) operates an embedded-finance search, comparison and
  recommendation engine for financial services. Its API matches consumers to personalized financial
  products — personal loans, credit cards, savings and deposit accounts, auto refinancing, HELOC and
  insurance — by submitting a lead (a user plus product search criteria) in exchange for a rate table
  of offers. The platform pairs the native API with embeddable marketplaces, calculators, widgets and
  mobile SDKs, plus approval-probability reports and channel-partner analytics. Even Financial was
  founded in 2015, backed by Canaan Partners, and rebranded to Engine by MoneyLion in 2023 following
  MoneyLion's acquisition.
