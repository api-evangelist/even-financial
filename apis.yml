- aid: even-financial:even-financial-approval-probability-api
  name: Even Financial Approval Probability API
  description: >-
    Approval probability reports contains data about the likelihood that a user with specified attributes
    will be approved for particular product offers.


    The user attributes are passed in the request's `POST` body. Attributes are specific to the product
    in questions and do not include personally identifiable information.


    The approval probabilty data is calculated per financial institution, as well as across the entire
    Engine by MoneyLion network. Within each of these groups, offer probablilities may be further broken
    down according to product attributes. For loans, for example, approval probabilities are associated
    with offer APR range and optionally product sub-type.
