apis:
- aid: even-financial:even-financial-analytics-api
  name: Even Financial Analytics API
  description: >-
    ### Introduction


    Welcome to Engine by MoneyLion's Integration Guide for our Supply Analytics data product, which provides
    funnel, payout and client tag data on specific leads and lead segments to better improve your monetization,
    consumer  experience and efficiency of user acquisition.


    Refer to [Developer Center](https://engine.tech/developer-center/loans-savings-second-look-marketplace/reporting-options-for-channel-partners/channel-partner-reporting-analytics-api-1)
    for detailed information on how to use this API.


    Supply Analytics offers three different reporting endpoints optimized for streaming time series datasets
    out of the Engine by MoneyLion API and into your system via periodic polling, as well as an endpoint
    to obtain a snapshot of all information regarding a single lead. This document contains everything
    needed to understand and integrate with all 4 endpoints offered.

    ### API Versions

    This document describes version 3 of the Supply Analytics API. The previous version available to partners
    is referred to as version 1. Version 2 was an internal release.

    All HTTP requests for this version must include header `API-Version: 2025-04-01`.


    ### API Endpoints


    We currently offer the following reporting endpoints providing real time insights into the funnel
    from user acquisition through conversion:


    1. LeadEvents: This endpoint tracks the lead funnel’s journey. With the Lead Events API, you can pull
    KPI related data for your funnel, measure conversions, and iterate so that you can meet your business
    goals.


    2. LeadPayouts: This endpoint tracks payout by conversion on a per-lead basis.


    3. LeadClientTags: This endpoint is used to check and confirm which client tags (ie. subID, clickID,
    or trafficsource) you have appended to each lead (unique Engine by MoneyLion generated leadUuid).
    It provides better customer segmentation and attribution by returning your supplied client-tags (key/value)
    pairs associated with a lead. It's explained with examples in depth in the "Get  lead client tags
    endpoint" section.


    The above endpoints can be used to stream information into your system and will be referred to as
    streaming endpoints. Additionally, we have the following endpoint to access an on-demand snapshot
    of lead information:


    4. LeadsInfo: This endpoint provides a combined snapshot of information about a single lead — all
    of its events, payouts and client tags in a single request.


    ### Basic Request to Supply Analytics API


    Every request to the Supply Analytics API streaming endpoints will return a JSON object with the following
    properties:


    - `data` is the array of objects that should be analyzed / loaded into your
      database.

    - `nextUrl` is the URL that should be persisted and used for the next
      request. It will include a `paginationToken`.

    - `shouldContinuePolling` is a boolean which signals if calling `nextUrl`
      will have published data available.

    - `paginationToken` is an opaque cursor that identifies the end of the
      current page and is used for the next request. It is already included in
      `nextUrl` and also provided separately for convenience.


    Events from financial institutions or other external systems may not be shared with Engine by MoneyLion
    for hours or days after they occur; using `paginationToken` ensures that backfilled records are not
    missed.


    A response contains all available data subject to the response size limit and any applied filters
    (such as `untilTimestamp`). Requesting a URL with a `sinceTimestamp` that is less than five minutes
    old will return an error, as it can take a few minutes to prepare the response. We suggest polling
    hourly as a starting point, but as long as you follow shouldContinuePolling, you can poll at any interval
    (>5 minutes). For convenience, we provide a `shouldContinuePolling` flag to indicate whether you should
    continue to poll the Supply Analytics endpoint. If `true`, continue with the `nextUrl`. If not, no
    further data is currently available.

    ``` curl -X GET \
      'https://api.engine.tech/supplyAnalytics/leadEvents?sinceTimestamp=2019-08-24T14%3A15%3A22Z' \
      -H 'Accept: application/json' \
      -H 'Authorization: Bearer {access-token}' \
      -H 'API-Version: 2025-04-01'
    ```

    Since `paginationToken` is initially not known, the initial request may specify the `sinceTimestamp`
    parameter. In the absence of both of them, the endpoint will start with the oldest record in the system.
    The `nextUrl` from response will only include `paginationToken`.

    ### Developer's Note About Time Zones

    Timestamps without an explicit timezone (timezones missing a suffix of `Z`, for example) are interpreted
    as UTC. However, we recommend passing an explicit timezone offset of Z in the timestamp query string
    parameter. All timestamps in responses, whether in the event as a field, or in the `nextUrl`, are
    UTC.

    ### Developer's Note About Flexible JSON Objects

    Engine by MoneyLion's goal is to enrich the data provided by the Supply Analytics endpoint over time
    to improve your insight and analytical abilities. Therefore, it is recommended that any integration
    or initial setup be created with the future possibility of additional data fields in mind. These will
    take the form of additional JSON keys. We'd recommend that your integration remain compatible if there
    are additional JSON key-values present. This will allow new rollouts and improvements to the supply
    analytics endpoint to happen as smoothly as possible.

    ### Backfilling

    When backfilling, the `sinceTimestamp` of your initial request URL should be to your starting point.
    You should request each subsequent URL in succession until you're caught up. You can use `untilTimestamp`
    to define the end time of backfill windows.


    ### Resources

    Partners can contact their assigned Engine by MoneyLion Partner Manager or partnersupport@engine.tech
    for help.
