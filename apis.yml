- aid: even-financial:even-financial-offer-preview-api
  name: Even Financial Offer Preview API
  description: >-
    Preview offers are matched based upon a simple set of anonymous criteria and as a result are not personalized.
    This is useful if you'd like to display offers without requesting personalized data. For example,
    you can improve a search experience by presenting example offers to the user prior to asking more
    detailed questions.


    Offers returned by these endpoints are identical to those that would be included in a rate table.
    But keep in mind that they are not personalized, and it's a better user experience to ultimtely present
    personalized offers to a user.
  humanURL: https://engine.tech/docs/api-reference/
