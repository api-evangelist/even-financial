      additionalProperties:
        type: array
        items:
          type: string
      maxProperties: 1
      minProperties: 1
      example:
        subid:
        - '123'
    LeadPersonalInformation:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
